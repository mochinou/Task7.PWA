<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Offline — NovaStore</title>
    <!--
      Standalone fallback page, precached by the Service Worker. It is used when a
      navigation cannot be served at all (e.g. the app shell is missing). Everything is
      inline so it renders without any network request.
    -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(160deg, #f8fafc 0%, #eef2ff 100%);
        color: #0f172a;
        line-height: 1.5;
      }
      .card {
        width: 100%;
        max-width: 460px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 2.25rem 1.5rem;
        text-align: center;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.1);
      }
      .icon {
        width: 84px;
        height: 84px;
        margin: 0 auto 1.1rem;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #eef2ff, #e0e7ff);
        color: #4f46e5;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.7rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        color: #475569;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }
      button,
      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border-radius: 10px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
      button {
        border: none;
        background: #4f46e5;
        color: #fff;
      }
      button:disabled {
        opacity: 0.65;
      }
      a {
        border: 1px solid #e2e8f0;
        color: #0f172a;
        background: #fff;
      }
      .status {
        margin-top: 1rem;
        font-size: 0.88rem;
        color: #b45309;
        min-height: 1.3em;
      }
      .brand {
        margin-top: 1.5rem;
        font-size: 0.8rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" /><path d="M8.5 16.43a5 5 0 0 1 7 0" /><path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.86a10 10 0 0 0-2-1.43" /><path d="M2 8.82a15 15 0 0 1 4.18-2.65" />
          <path d="M22 8.82a15 15 0 0 0-11.29-3.76" /><path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        NovaStore can't reach the internet right now. Check your Wi-Fi or mobile data —
        pages you've already visited will be available again as soon as the app loads.
      </p>
      <div class="actions">
        <button id="retry" type="button">Retry Connection</button>
        <a href="./">Open NovaStore</a>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="brand">NovaStore · Offline mode</div>
    </main>
    <script>
      (function () {
        var button = document.getElementById('retry');
        var status = document.getElementById('status');
        function tryReconnect() {
          button.disabled = true;
          button.textContent = 'Checking…';
          fetch('./manifest.json?ping=' + Date.now(), { cache: 'no-store' })
            .then(function () {
              return fetch('https://dummyjson.com/test?ts=' + Date.now(), { cache: 'no-store' });
            })
            .then(function () {
              status.textContent = 'Connection restored. Loading…';
              window.location.href = './';
            })
            .catch(function () {
              status.textContent = 'Still offline. Please try again in a moment.';
              button.disabled = false;
              button.textContent = 'Retry Connection';
            });
        }
        button.addEventListener('click', tryReconnect);
        window.addEventListener('online', tryReconnect);
      })();
    </script>
  </body>
</html>
